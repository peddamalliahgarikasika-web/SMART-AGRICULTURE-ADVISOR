{% extends 'base.html' %}

{% block content %}

<h2>Admin Panel</h2>

<h3>Users</h3>

<table class="table table-bordered">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
</tr>

{% for user in users %}

<tr>
    <td>{{ user.id }}</td>
    <td>{{ user.name }}</td>
    <td>{{ user.email }}</td>
</tr>

{% endfor %}

</table>

{% endblock %}
